# version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - frontend
    networks:
      - lms_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: lms_php
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-lms}
      - DB_USERNAME=${DB_USERNAME:-lms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=${REDIS_PORT:-6379}
    networks:
      - lms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: lms_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    networks:
      - lms_network

  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    environment:
      - POSTGRES_DB=${DB_DATABASE:-lms}
      - POSTGRES_USER=${DB_USERNAME:-lms_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lms_user} -d ${DB_DATABASE:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - lms_redis_data:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: lms_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lms_network

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: lms_queue
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - php
      - redis
    networks:
      - lms_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: lms_scheduler
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - php
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  lms_postgres_data:
    driver: local
  lms_redis_data:
    driver: local
